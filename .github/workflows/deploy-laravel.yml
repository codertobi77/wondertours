# Déploiement Laravel sur LWS Perso — frontend Next.js statique + API Laravel.
#
# Le frontend Next.js est buildé puis copié dans laravel/public/ ;
# Laravel sert à la fois l'API (/api/*) et les fichiers statiques.
#
# Déclenchement :
#   - automatique : à chaque CI verte sur master (workflow_run) ;
#   - manuel : workflow_dispatch.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   FTP_HOST, FTP_USER, FTP_PASSWORD   accès FTP cPanel LWS
#   DATABASE_URL                       PostgreSQL Aiven
#   AUTH_SECRET                        secret JWT
#   APP_URL                            https://wondertoursandservices.com
#   APP_KEY                            clé Laravel (php artisan key:generate)
#   ADMIN_EMAIL, ADMIN_PASSWORD        compte admin
# Optionnels : RESEND_API_KEY, DEEPL_API_KEY, IMGBB_API_KEY, GITHUB_TOKEN (publish)

name: Deploy Laravel LWS

on:
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-laravel
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=0
          for v in FTP_HOST FTP_USER FTP_PASSWORD DATABASE_URL AUTH_SECRET APP_URL APP_KEY ADMIN_EMAIL ADMIN_PASSWORD DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "❌ Secret requis absent : $v" >&2; missing=1; fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "✓ Secrets requis présents"

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, mbstring, curl, openssl, tokenizer, xml, ctype, json, bcmath, fileinfo

      - name: Installer les dépendances PHP (Composer)
        working-directory: laravel
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Écrire le .env Laravel
        working-directory: laravel
        run: |
          cat > .env <<EOF
          APP_NAME="Wonder Tours"
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_TIMEZONE=UTC
          APP_URL=${{ secrets.APP_URL }}
          APP_LOCALE=fr
          APP_FALLBACK_LOCALE=fr
          DB_CONNECTION=pgsql
          DB_HOST=pg-wondert-eaxi-project.h.aivencloud.com
          DB_PORT=12733
          DB_DATABASE=defaultdb
          DB_USERNAME=avnadmin
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SSLMODE=require
          CACHE_STORE=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          EDITOR_EMAIL=${{ secrets.EDITOR_EMAIL }}
          EDITOR_PASSWORD=${{ secrets.EDITOR_PASSWORD }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          DEEPL_API_KEY=${{ secrets.DEEPL_API_KEY }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          MAIL_FROM="Wonder Tours <onboarding@resend.dev>"
          MAIL_TEAM_EMAIL=contact@wondertoursandservices.com
          GITHUB_TOKEN=${{ secrets.GH_PAT }}
          GITHUB_REPO=codertobi77/wondertours
          EOF

      - name: Optimiser Laravel
        working-directory: laravel
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Build assets Vite (React/Inertia)
        working-directory: laravel
        run: bun install && bun run build

      - name: Copier le .htaccess Laravel
        run: cp laravel/public/.htaccess laravel/public/.htaccess 2>/dev/null || true

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Écrire les identifiants FTP (~/.netrc, perms 600)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          TH="$(printf '%s' "$FTP_HOST" | tr -d '[:space:]')"
          TU="$(printf '%s' "$FTP_USER" | tr -d '[:space:]')"
          TP="$(printf '%s' "$FTP_PASSWORD" | tr -d '[:space:]')"
          umask 077
          printf 'machine %s login %s password %s\n' "$TH" "$TU" "$TP" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Déployer Laravel → racine FTP (public_html)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          TH="$(printf '%s' "$FTP_HOST" | tr -d '[:space:]')"
          lftp "$TH" -e "set ftp:ssl-allow true; set ssl:verify-certificate no; set ftp:ignore-pasv-address yes; set net:timeout 45; set net:max-retries 5; mirror -R --delete --parallel=2 --verbose=2 laravel/ ./; quit"

      - name: Smoke de l'API en production
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: SMOKE_API_ONLY=1 bash scripts/smoke-api.sh "$APP_URL"

      - name: Nettoyer les fichiers sensibles du run
        if: always()
        run: rm -f .env laravel/.env "$HOME/.netrc"
