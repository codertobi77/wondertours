# Packaging LWS (cPanel / Passenger) — construit le bundle standalone et le
# publie en artefact téléchargeable ; sur tag lws-v*, crée aussi une GitHub
# Release avec le tar.gz en pièce jointe.
# Le mutualisé LWS n'offre pas de déploiement automatisé (pas d'accès SSH ni
# d'API) : l'upload vers cPanel reste manuel — procédure dans
# docs/deployment-lws.md.
name: Package LWS

on:
  workflow_dispatch:
  push:
    tags:
      - "lws-v*"

permissions:
  contents: write # création de la Release sur les tags

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Construire et empaqueter le bundle
        # Sans --smoke : pas de base de données en CI. Le build ne se connecte
        # pas à la base (pages publiques en force-dynamic, API en route
        # handlers). Le --smoke local reste la validation d'avant-upload.
        run: bash scripts/package-lws.sh

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: wondertours-lws-bundle
          path: dist-lws/*.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Créer la GitHub Release (tags uniquement)
        if: startsWith(github.ref, 'refs/tags/lws-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist-lws/*.tar.gz \
            --title "Déploiement LWS $tag" \
            --notes "Bundle standalone prêt pour cPanel (Passenger) — procédure : docs/deployment-lws.md"
