# Déploiement continu de l'API PHP vers LWS (mutualisé Perso) via FTP/lftp.
#
# Le frontend Next.js est déployé séparément sur Vercel (import GitHub, push
# auto sur master). Ce workflow ne déploie que l'API PHP (php-api/) sous
# htdocs/api.wondertoursandservices.com/api/ (document root du sous-domaine
# api.wondertoursandservices.com sur LWS Perso) et applique les migrations
# Prisma sur Aiven.
#
# Déclenchement :
#   - automatique : à chaque CI verte sur master (workflow_run) ;
#   - manuel : workflow_dispatch (onglet Actions).
#
# Ordre (l'API reste disponible pendant la mise à jour) :
#   1. migrations PostgreSQL (prisma migrate deploy, base Aiven) ;
#   2. php-api/config.local.php généré depuis les secrets (gitignoré,
#      uploadé par lftp — c'est la config du serveur) ;
#   3. upload API → htdocs/api.wondertoursandservices.com/api/
#      (routeur .htaccess inclus) ;
#   4. smoke des 39 routes du contrat sur https://api.wondertoursandservices.com.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   FTP_HOST, FTP_USER, FTP_PASSWORD   accès FTP cPanel LWS
#   DATABASE_URL                       PostgreSQL Aiven (sslmode=require)
#   AUTH_SECRET                        secret JWT (identique à Vercel —
#                                      sessions compatibles entre stacks)
#   APP_URL                            https://wondertoursandservices.com —
#                                      base des liens emails + cible du smoke
#   ADMIN_EMAIL, ADMIN_PASSWORD        compte admin (smoke + login)
# Optionnels (fonctionnalités dégradées sinon, jamais bloquants) :
#   RESEND_API_KEY, DEEPL_API_KEY, IMGBB_API_KEY,
#   EDITOR_EMAIL, EDITOR_PASSWORD (checks éditeur du smoke)

name: Deploy PHP API LWS

on:
  workflow_dispatch:
  repository_dispatch:
    types: [content-updated]
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: deploy-lws
  cancel-in-progress: false

jobs:
  deploy:
    # Les runs de CI des PR (head_branch != master) ne déploient pas.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets de déploiement
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          EDITOR_EMAIL: ${{ secrets.EDITOR_EMAIL }}
          EDITOR_PASSWORD: ${{ secrets.EDITOR_PASSWORD }}
        run: |
          missing=0
          for v in FTP_HOST FTP_USER FTP_PASSWORD DATABASE_URL AUTH_SECRET APP_URL ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "❌ Secret requis absent : $v (Settings → Secrets and variables → Actions)" >&2
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "✓ Secrets requis présents"
          for v in RESEND_API_KEY DEEPL_API_KEY IMGBB_API_KEY EDITOR_EMAIL EDITOR_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::warning::Secret optionnel absent : $v — fonctionnalité dégradée (ou checks éditeur du smoke ignorés)"
            fi
          done

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
        # PHP ne sert qu'à générer php-api/config.local.php
        # (php-api/scripts/gen-config-local.php — aucune extension requise).

      - name: Écrire le .env du run (éphémère)
        run: |
          cat > .env <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          APP_URL=${{ secrets.APP_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          DEEPL_API_KEY=${{ secrets.DEEPL_API_KEY }}
          IMGBB_API_KEY=${{ secrets.IMGBB_API_KEY }}
          GITHUB_TOKEN=${{ secrets.GH_PAT }}
          SECURE_COOKIES=true
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          EDITOR_EMAIL=${{ secrets.EDITOR_EMAIL }}
          EDITOR_PASSWORD=${{ secrets.EDITOR_PASSWORD }}
          EOF

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Générer le client Prisma
        run: bun run db:generate

      - name: Appliquer les migrations (prisma migrate deploy) sur Aiven
        run: bun run db:deploy
        # Toujours en premier : le schéma Aiven est migré avant que le
        # nouveau code ne soit uploadé (l'API PHP sert ce même schéma).

      - name: Générer php-api/config.local.php depuis les secrets
        run: php php-api/scripts/gen-config-local.php
        # Lit le .env ci-dessus (aucune valeur affichée) et écrit
        # php-api/config.local.php (gitignoré, perms 600).

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Déployer l'API PHP → api/ (racine FTP = public_html)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Credentials trimmés dans la même étape (évite les retours à la ligne
          # des secrets GitHub et la dépendance au .netrc entre étapes).
          TH="$(printf '%s' "$FTP_HOST" | tr -d '[:space:]')"
          TU="$(printf '%s' "$FTP_USER" | tr -d '[:space:]')"
          TP="$(printf '%s' "$FTP_PASSWORD" | tr -d '[:space:]')"
          lftp -u "$TU","$TP" "$TH" -e "set ftp:ssl-allow true; set ssl:verify-certificate no; set ftp:ignore-pasv-address yes; set net:timeout 45; set net:max-retries 5; debug 3; mirror -R --delete --parallel=2 --verbose=2 -X router-dev.php -X test-connexion.php -X config.example.php -X scripts/ -X scripts/* php-api/ htdocs/api.wondertoursandservices.com/api/; quit"
        # Inclut php-api/.htaccess (routeur /api/) et config.local.php
        # (secrets du serveur). Exclus : outils de dev uniquement.
        # --delete retire côté serveur les fichiers retirés du dépôt.
        # Document root LWS : htdocs/api.wondertoursandservices.com/
        # L'API est servie sous https://api.wondertoursandservices.com/api/*

      - name: Smoke de l'API en production (sous-domaine api.)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          # L'API PHP est servie sur le sous-domaine api.wondertoursandservices.com
          # (LWS Perso) — le smoke teste le contrat API directement dessus.
          API_URL: https://api.wondertoursandservices.com
        run: SMOKE_API_ONLY=1 bash scripts/smoke-api.sh "$API_URL"
        # Vérifie le contrat complet sur l'API en production (endpoints
        # publics, écritures, auth admin/éditeur, 401/403, CRUD, rôles). Crée
        # puis supprime une réservation, une demande de contact et un compte de
        # test dans la base (nettoyage psql via le .env du run).

      - name: Nettoyer les fichiers sensibles du run
        if: always()
        run: rm -f .env php-api/config.local.php "$HOME/.netrc"