# Déploiement continu de l'API PHP vers LWS (mutualisé Perso) via FTP/lftp.
#
# Le frontend Next.js est déployé séparément sur Vercel (cf. deploy-frontend.yml).
# Ce workflow ne déploie que l'API PHP (php-api/). Il est conçu pour ne se
# déclencher que quand des fichiers backend sont modifiés : une modification
# frontend seule ne redéploie pas l'API, et inversement.
#
# Déclenchement :
#   - automatique : après une CI verte sur master, uniquement si le run CI a
#     modifié des fichiers backend (php-api/, prisma/, render.yaml…) — sinon le
#     déploiement est ignoré ;
#   - manuel : workflow_dispatch (onglet Actions) — toujours déployé ("à la
#     demande") ;
#
# Le déclencheur repository_dispatch (bouton « Publier le site » du dashboard)
# a été retiré : le dashboard ne déclenche plus de rebuild du site.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   FTP_HOST, FTP_USER, FTP_PASSWORD   accès FTP cPanel LWS
#   DATABASE_URL                       PostgreSQL Aiven (sslmode=require)
#   AUTH_SECRET                        secret JWT (identique à Vercel — sessions compatibles)
#   APP_URL                            https://wondertoursandservices.com
#   ADMIN_EMAIL, ADMIN_PASSWORD        compte admin (smoke + login)
# Optionnels (fonctionnalités dégradées sinon, jamais bloquants) :
#   RESEND_API_KEY, DEEPL_API_KEY, IMGBB_API_KEY, EDITOR_EMAIL, EDITOR_PASSWORD, GH_PAT

name: Deploy PHP API LWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-lws
  cancel-in-progress: false

jobs:
  deploy:
    # Les runs de CI des PR (head_branch != master) ne déploient pas.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les secrets de déploiement
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          EDITOR_EMAIL: ${{ secrets.EDITOR_EMAIL }}
          EDITOR_PASSWORD: ${{ secrets.EDITOR_PASSWORD }}
        run: |
          missing=0
          for v in FTP_HOST FTP_USER FTP_PASSWORD DATABASE_URL AUTH_SECRET APP_URL ADMIN_EMAIL ADMIN_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "❌ Secret requis absent : $v (Settings → Secrets and variables → Actions)" >&2
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "✓ Secrets requis présents"
          for v in RESEND_API_KEY DEEPL_API_KEY IMGBB_API_KEY EDITOR_EMAIL EDITOR_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::warning::Secret optionnel absent : $v — fonctionnalité dégradée (ou checks éditeur du smoke ignorés)"
            fi
          done

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Un déploiement backend n'est utile que si le run CI a touché le backend.
      # En workflow_dispatch / repository_dispatch (manuel ou « publier »), on
      # déploie quoi qu'il arrive.
      - name: Détecter si ce run modifie le backend
        id: changes
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "Déploiement déclenché manuellement : l'API est (re)déployée."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              # Fichiers modifiés par le push sur master qui a déclenché la CI.
              if git diff --name-only HEAD~1 HEAD \
                 | grep -Eq '^(php-api/|prisma/|render\.yaml|scripts/smoke-api\.sh|php-api/scripts/gen-config-local\.php|\.github/workflows/deploy-lws\.yml)'; then
                echo "Changements backend détectés — déploiement de l'API."
                echo "changed=true" >> "$GITHUB_OUTPUT"
              else
                echo "Aucun changement backend — déploiement API ignoré (modification frontend uniquement)."
                echo "changed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
          esac

      - name: Ignorer si aucun changement backend
        if: steps.changes.outputs.changed != 'true'
        run: echo "Déploiement API ignoré." && exit 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, mbstring, curl, openssl, tokenizer, xml, ctype, json, bcmath, fileinfo
        # PHP ne sert qu'à générer php-api/config.local.php (aucune extension requise).

      - name: Écrire le .env du run (éphémère)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          SECURE_COOKIES: "true"
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          EDITOR_EMAIL: ${{ secrets.EDITOR_EMAIL }}
          EDITOR_PASSWORD: ${{ secrets.EDITOR_PASSWORD }}
        run: |
          cat > .env <<EOF
          DATABASE_URL=${DATABASE_URL}
          AUTH_SECRET=${AUTH_SECRET}
          APP_URL=${APP_URL}
          RESEND_API_KEY=${RESEND_API_KEY}
          DEEPL_API_KEY=${DEEPL_API_KEY}
          IMGBB_API_KEY=${IMGBB_API_KEY}
          GITHUB_TOKEN=${GITHUB_TOKEN}
          SECURE_COOKIES=true
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          EDITOR_EMAIL=${EDITOR_EMAIL}
          EDITOR_PASSWORD=${EDITOR_PASSWORD}
          EOF

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Générer le client Prisma
        run: bun run db:generate

      - name: Appliquer les migrations (prisma migrate deploy) sur Aiven
        run: bun run db:deploy
        # Toujours en premier : le schéma Aiven est migré avant que le
        # nouveau code ne soit uploadé (l'API PHP sert ce même schéma).

      - name: Générer php-api/config.local.php depuis les secrets
        run: php php-api/scripts/gen-config-local.php
        # Lit le .env ci-dessus (aucune valeur affichée) et écrit
        # php-api/config.local.php (gitignoré, perms 600).

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Vérifie que le serveur FTP LWS est joignable et que les identifiants
      # fonctionnent AVANT de lancer le déploiement : évite d'échouer en cours
      # de mirror (mirror: Not connected) et donne un message clair dès le départ.
      - name: Vérifier la connexion FTP LWS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          TH="$(printf '%s' "$FTP_HOST" | tr -d '[:space:]')"
          TU="$(printf '%s' "$FTP_USER" | tr -d '[:space:]')"
          TP="$(printf '%s' "$FTP_PASSWORD" | tr -d '[:space:]')"
          if ! lftp -u "$TU","$TP" "$TH" -e "set ftp:ssl-allow true; set ssl:verify-certificate no; set ftp:ignore-pasv-address yes; set net:timeout 30; set net:max-retries 2; ls /; quit" >/dev/null 2>&1; then
            echo "❌ Connexion FTP LWS impossible sur $FTP_HOST (vérifiez FTP_HOST/FTP_USER/FTP_PASSWORD et l'accès réseau depuis GitHub Actions)." >&2
            exit 1
          fi
          echo "✓ Connexion FTP LWS OK ($FTP_HOST)"

      - name: Déployer l'API PHP → api/ + root .htaccess (racine FTP = public_html)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          
          # 1. Déployer php-api/ → htdocs/api.wondertoursandservices.com/api/
          lftp -u "$TU","$TP" "$TH" -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:ignore-pasv-address yes;
            set net:timeout 45;
            set net:max-retries 5;
            debug 3;
            mirror -R --delete --parallel=2 --verbose=2 \
              -X router-dev.php \
              -X test-connexion.php \
              -X config.example.php \
              -X scripts/ \
              -X scripts/* \
              php-api/ htdocs/api.wondertoursandservices.com/api/;
            quit
          "
          
          # 2. Déployer .htaccess racine du sous-domaine → htdocs/api.wondertoursandservices.com/
          lftp -u "$TU","$TP" "$TH" -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:ignore-pasv-address yes;
            set net:timeout 45;
            set net:max-retries 5;
            put .htaccess-api-root -o htdocs/api.wondertoursandservices.com/.htaccess;
            quit
          "
          
          # 3. Fixer permissions config.local.php (600) — uploads/ existe déjà
          lftp -u "$TU","$TP" "$TH" -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate no;
            set ftp:ignore-pasv-address yes;
            set net:timeout 45;
            set net:max-retries 5;
            chmod 600 htdocs/api.wondertoursandservices.com/api/config.local.php;
            quit
          "
        # Inclut php-api/.htaccess (routeur /api/) et config.local.php (perms 600)
        # + .htaccess racine du sous-domaine + dossier uploads/
        # Exclus : outils de dev uniquement (router-dev.php, test-connexion.php, config.example.php, scripts/)
        # --delete retire côté serveur les fichiers retirés du dépôt.
        # Document root LWS : api.wondertoursandservices.com/ (à la racine FTP)
        # L'API est servie sous https://api.wondertoursandservices.com/api/*

      - name: Nettoyer le répertoire htdocs égaré (à retirer après vérification)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Un ancien chemin de déploiement a créé htdocs/ à la racine FTP
          # (jamais servi par HTTP, contient config.local.php) : on le retire.
          TH="$(printf '%s' "$FTP_HOST" | tr -d '[:space:]')"
          TU="$(printf '%s' "$FTP_USER" | tr -d '[:space:]')"
          TP="$(printf '%s' "$FTP_PASSWORD" | tr -d '[:space:]')"
          lftp -u "$TU","$TP" "$TH" -e "set ftp:ssl-allow true; set ssl:verify-certificate no; set ftp:ignore-pasv-address yes; set net:timeout 45; set net:max-retries 3; rm -rf htdocs; quit" 2>&1 || true

      - name: Smoke de l'API en production (sous-domaine api.)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          # L'API PHP est servie sur le sous-domaine api.wondertoursandservices.com
          # (LWS Perso) — le smoke teste le contrat API directement dessus.
          API_URL: https://api.wondertoursandservices.com
        run: SMOKE_API_ONLY=1 bash scripts/smoke-api.sh "$API_URL"
        # Vérifie le contrat complet sur l'API en production (endpoints
        # publics, écritures, auth admin/éditeur, 401/403, CRUD, rôles). Crée
        # puis supprime une réservation, une demande de contact et un compte de
        # test dans la base (nettoyage psql via le .env du run).

      - name: Nettoyer les fichiers sensibles du run
        if: always()
        run: rm -f .env php-api/config.local.php "$HOME/.netrc"
