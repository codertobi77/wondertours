# CI Wonder Tours — lint, types, tests (PostgreSQL éphémère) et build.
# Aucun secret requis : la base est un conteneur de service frais et les tests
# créent leurs propres données (préfixes uniques, nettoyage inclus) ; les
# intégrations externes (imgBB, DeepL) sont mockées ou testent les gardes.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # déclenchement manuel (onglet Actions) — utile si les
                      # workflows sont activés après des pushes (forks)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wondertours
          POSTGRES_PASSWORD: wondertours
          POSTGRES_DB: wondertours_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wondertours -d wondertours_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://wondertours:wondertours@localhost:5432/wondertours_test
      AUTH_SECRET: secret-ci-wondertours-jamais-en-production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Générer le client Prisma
        run: bun run db:generate

      - name: Appliquer les migrations
        run: bun run db:deploy

      - name: Seed (idempotent — sans les comptes, absents de l'env CI)
        run: bun run db:seed

      - name: Lint
        run: bun run lint

      - name: Typecheck
        # Les types globaux de routes (PageProps, RouteContext…) sont générés
        # par Next (next dev/build/typegen) — absents d'un checkout frais.
        # Cf. docs Next : « next typegen && tsc --noEmit » en CI.
        run: |
          bunx next typegen
          bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: "Build Next.js (export statique → out/)"
        # APP_URL="" désactive le fetch de contenu au build (cf. lib/content.ts)
        # → repli lib/data/* : la CI ne dépend d'aucune API déployée.
        env:
          APP_URL: ""
        run: bun run build

      - name: "Vérifier l'export statique"
        # trailingSlash=false : chaque route est exportée en <route>.html
        # (les dossiers du même nom ne contiennent que les payloads RSC en
        # .txt, aucun index.html). La coquille sentinelle _.html couvre tous
        # les UUID des pages d'édition dashboard (cf. .htaccess racine).
        run: |
          test -f out/index.html
          test -f out/circuits.html
          test -f out/blog.html
          test -f out/dashboard.html
          test -f out/dashboard/circuits/_.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          ls out/circuits/*.html >/dev/null
          ls out/blog/*.html >/dev/null

  laravel-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wondertours
          POSTGRES_PASSWORD: wondertours
          POSTGRES_DB: wondertours_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wondertours -d wondertours_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: wondertours_test
      DB_USERNAME: wondertours
      DB_PASSWORD: wondertours
      AUTH_SECRET: secret-ci-wondertours-jamais-en-production
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, mbstring, curl, openssl, tokenizer, xml, ctype, json, bcmath, fileinfo

      - name: Installer les dépendances Composer
        working-directory: laravel
        run: composer install --no-interaction --prefer-dist

      - name: Copier .env
        working-directory: laravel
        run: |
          cp .env.example .env
          sed -i 's/DB_HOST=.*/DB_HOST=localhost/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=wondertours_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=wondertours/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=wondertours/' .env
          sed -i 's/AUTH_SECRET=.*/AUTH_SECRET=secret-ci-wondertours-jamais-en-production/' .env

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build assets Vite
        working-directory: laravel
        run: bun install && bun run build

      - name: Générer la clé
        working-directory: laravel
        run: php artisan key:generate --force

      - name: Migrations
        working-directory: laravel
        run: php artisan migrate --force

      - name: Tests Laravel
        working-directory: laravel
        run: php artisan test

      - name: Lint PHP
        working-directory: laravel
        run: vendor/bin/pint --test 2>/dev/null || php -l app/Http/Controllers/Api/PublicController.php
