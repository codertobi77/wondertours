# CI Wonder Tours — lint, types, tests (PostgreSQL éphémère) et build Next.js.
# Aucun secret requis : la base est un conteneur de service frais et les tests
# créent leurs propres données ; les intégrations externes (imgBB, DeepL, Resend)
# sont mockées ou testent les gardes.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextjs-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wondertours
          POSTGRES_PASSWORD: wondertours
          POSTGRES_DB: wondertours_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wondertours -d wondertours_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://wondertours:wondertours@localhost:5432/wondertours_test
      AUTH_SECRET: secret-ci-wondertours-jamais-en-production
      ADMIN_EMAIL: admin@wondertoursandservices.com
      ADMIN_PASSWORD: xzcpbh2IrQ6I5skH
      EDITOR_EMAIL: editor@wondertoursandservices.com
      EDITOR_PASSWORD: WAWfZG3Uyuevgn08
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8099
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Générer le client Prisma
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Tests (bun test)
        run: bun test

      - name: Build Next.js (export statique)
        run: bun run build

  php-api-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, mbstring, curl, openssl, tokenizer, xml, ctype, json, bcmath, fileinfo

      - name: Lint PHP (syntax)
        run: |
          for f in php-api/index.php php-api/router-dev.php php-api/handlers/*.php php-api/lib/*.php; do
            php -l "$f"
          done

      - name: Test de connexion PHP (syntax only, sans base)
        run: php -l php-api/test-connexion.php